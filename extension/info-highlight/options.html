<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Info Highlight</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f1f1f;
      --muted: #5e5e5e;
      --bg: #fff;
      --line: #e1e3e1;
      --btn-border: #747775;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e3e3e3;
        --muted: #c4c7c5;
        --bg: #1f1f1f;
        --line: #444746;
        --btn-border: #8e918f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.45 system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .top {
      border-bottom: 1px solid var(--line);
    }
    .top-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .top-icon { width: 40px; height: 40px; border-radius: 8px; }
    .top-name { font-size: 22px; font-weight: 600; }
    main { max-width: 680px; margin: 0 auto; padding: 28px 24px 64px; }
    h2 {
      font-size: 1.05rem;
      font-weight: 500;
      margin: 0 0 0.25rem;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    label.row { cursor: pointer; }
    .row-text { min-width: 0; }
    .row-title { font-size: 16px; }
    .row-desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }
    button {
      flex-shrink: 0;
      font: inherit;
      font-weight: 500;
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.45; cursor: default; }
    .row-btns { display: flex; flex-shrink: 0; gap: 8px; }
    select {
      flex-shrink: 0;
      font: inherit;
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
    }
    main h2:not(:first-of-type) { margin-top: 28px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <img id="brand_icon" class="top-icon" width="40" height="40" alt="">
      <span id="brand_name" class="top-name"></span>
    </div>
  </header>
  <main>
    <h2>显示</h2>
    <label class="row">
      <div class="row-text">
        <div class="row-title">顶部走势图</div>
        <p class="row-desc">在页面顶部标出全文信息量变化，以及你正在看的位置</p>
      </div>
      <input type="checkbox" id="show_progress">
    </label>
    <label class="row">
      <div class="row-text">
        <div class="row-title">悬停查看详情</div>
        <p class="row-desc">鼠标停在文字上时，显示该处信息量和更可能出现的词。同一页再次分析时不显示。</p>
      </div>
      <input type="checkbox" id="show_token_tip">
    </label>
    <h2>分析</h2>
    <div class="row">
      <div class="row-text">
        <div class="row-title">在哪分析</div>
        <p class="row-desc">自动会优先用本机。仅本机不上传正文，也不会改去云端。</p>
      </div>
      <select id="analyze_pref" aria-label="在哪分析">
        <option value="auto">自动</option>
        <option value="local">仅本机</option>
        <option value="cloud">仅云端</option>
      </select>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">本机 WebGPU</div>
        <p id="webgpu_desc" class="row-desc">正在检测…</p>
      </div>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">本机模型</div>
        <p id="model_desc" class="row-desc">正在读取…</p>
      </div>
      <div class="row-btns">
        <button type="button" id="local_init">准备</button>
        <button type="button" id="model_clear" disabled>清空</button>
      </div>
    </div>
    <h2>存储</h2>
    <div class="row">
      <div class="row-text">
        <div class="row-title">分析缓存</div>
        <p id="cache_desc" class="row-desc"></p>
      </div>
      <button type="button" id="cache_clear">清空</button>
    </div>
  </main>
  <script src="cache/ring-store.js"></script>
  <script src="analyzeCache.js"></script>
  <script src="local/state.js"></script>
  <script src="options.js"></script>
</body>
</html>
