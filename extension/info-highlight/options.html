<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Info Highlight</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f1f1f;
      --muted: #5e5e5e;
      --bg: #fff;
      --line: #e1e3e1;
      --btn-border: #747775;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e3e3e3;
        --muted: #c4c7c5;
        --bg: #1f1f1f;
        --line: #444746;
        --btn-border: #8e918f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.45 system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .top {
      border-bottom: 1px solid var(--line);
    }
    .top-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .top-icon { flex-shrink: 0; width: 40px; height: 40px; border-radius: 8px; }
    .top-name { font-size: 22px; font-weight: 600; }
    main { max-width: 680px; margin: 0 auto; padding: 28px 24px 64px; }
    h2 {
      font-size: 1.05rem;
      font-weight: 500;
      margin: 0 0 0.25rem;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    label.row { cursor: pointer; }
    .row-text { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; }
    .row-desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }
    button {
      flex-shrink: 0;
      font: inherit;
      font-weight: 500;
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.45; cursor: default; }
    .row-btns { display: flex; flex-shrink: 0; gap: 8px; }
    select {
      flex-shrink: 0;
      font: inherit;
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
    }
    main h2:not(:first-of-type) { margin-top: 28px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <img id="brand_icon" class="top-icon" width="40" height="40" alt="">
      <span id="brand_name" class="top-name"></span>
    </div>
  </header>
  <main>
    <h2>Display</h2>
    <label class="row">
      <div class="row-text">
        <div class="row-title">Progress chart</div>
        <p class="row-desc">Show how information density changes across the page, and where you are</p>
      </div>
      <input type="checkbox" id="show_progress">
    </label>
    <label class="row">
      <div class="row-text">
        <div class="row-title">Hover for details</div>
        <p class="row-desc">When the pointer rests on text, show its information density and more likely words. Hidden when you analyze the same page again.</p>
      </div>
      <input type="checkbox" id="show_token_tip" checked>
    </label>
    <h2>Analysis</h2>
    <div class="row">
      <div class="row-text">
        <div class="row-title">Where to analyze</div>
        <p class="row-desc">Auto prefers this device. On-device only does not upload the page, and will not fall back to the cloud.</p>
      </div>
      <select id="analyze_pref" aria-label="Where to analyze">
        <option value="auto">Auto</option>
        <option value="local">On this device only</option>
        <option value="cloud">Cloud only</option>
      </select>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">On-device WebGPU</div>
        <p id="webgpu_desc" class="row-desc">Checking…</p>
      </div>
    </div>
    <div class="row">
      <div class="row-text">
        <div class="row-title">On-device model</div>
        <p id="model_desc" class="row-desc">Reading…</p>
      </div>
      <div class="row-btns">
        <button type="button" id="local_init">Prepare</button>
        <button type="button" id="model_clear" disabled>Clear</button>
      </div>
    </div>
    <h2>Storage</h2>
    <div class="row">
      <div class="row-text">
        <div class="row-title">Analysis cache</div>
        <p id="cache_desc" class="row-desc"></p>
      </div>
      <button type="button" id="cache_clear">Clear</button>
    </div>
  </main>
  <script src="cache/ring-store.js"></script>
  <script src="analyzeCache.js"></script>
  <script src="local/state.js"></script>
  <script src="options.js"></script>
</body>
</html>
