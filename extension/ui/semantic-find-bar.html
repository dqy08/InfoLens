<!-- 权威源：改 Find bar DOM 只改本文件；同步到 client 时手工覆盖 client/src/partials/semantic-find-bar.html -->
<div id="semantic_find_bar" class="semantic-find-bar-host" hidden>
    <!-- bar / 进度图 / 状态条同宽；宽度由 bar 决定 -->
    <div class="semantic-find-bar-stack">
        <div class="semantic-find-bar">
            <div class="semantic-search-input-wrapper semantic-find-bar-input-wrap">
                <input type="text" id="semantic_find_input" class="semantic-find-input" placeholder="Semantic find" data-i18n="placeholder" autocomplete="off">
                <button type="button" id="semantic_find_clear" class="semantic-search-clear demo-delete-btn" title="Clear" aria-label="Clear" data-i18n="title,aria-label">×</button>
            </div>
            <ul id="semantic_find_history_dropdown" class="semantic-search-history-dropdown"></ul>
            <span class="semantic-find-bar-sep" aria-hidden="true"></span>
            <button type="button" id="semantic_find_prev" class="semantic-find-bar-btn" title="Previous match" aria-label="Previous match" disabled>
                <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5 L6 4.5 L9 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" id="semantic_find_next" class="semantic-find-bar-btn" title="Next match" aria-label="Next match" disabled>
                <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" id="semantic_find_close" class="semantic-find-bar-btn semantic-find-bar-close" title="Close" aria-label="Close">
                <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 3.5 L8.5 8.5 M8.5 3.5 L3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
        </div>
        <svg id="semantic_match_progress" class="semantic-match-progress" viewBox="0 0 100 42" aria-label="Semantic match progress" hidden>
            <g id="semantic_match_progress_lines"></g>
        </svg>
        <div id="semantic_find_backend_notice" class="semantic-find-strip semantic-find-backend-notice" hidden role="status">
            <span class="semantic-find-backend-notice-text">Temporarily using backup server(slow)</span>
            <button type="button" id="semantic_find_backend_notice_feedback" class="semantic-find-status-feedback" title="Report this to the author" aria-label="Report this to the author">
                <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 L9.5 2.5 L5.5 10 L5 7 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" id="semantic_find_backend_notice_close" class="semantic-find-status-close" title="Dismiss" aria-label="Dismiss">×</button>
        </div>
        <div id="semantic_find_status" class="semantic-find-strip semantic-find-status" hidden role="status">
            <span id="semantic_find_status_text" class="semantic-find-status-text"></span>
            <div class="semantic-find-status-actions">
                <button type="button" id="semantic_find_status_feedback" class="semantic-find-status-feedback" title="Report this to the author" aria-label="Report this to the author">
                    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 L9.5 2.5 L5.5 10 L5 7 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" id="semantic_find_status_continue" class="semantic-find-status-continue" hidden title="Continue search" aria-label="Continue search">Continue</button>
                <button type="button" id="semantic_find_status_close" class="semantic-find-status-close" title="Dismiss" aria-label="Dismiss">×</button>
            </div>
        </div>
    </div>
</div>
